<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Epic</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      body { margin: 0; }
      #root { padding: 0 2px 4px; }
      .crumbs { margin: 0 0 8px; color: #5e6c84; }
      .crumbs a, .children a { cursor: pointer; }
      .children { list-style: none; margin: 0 0 8px; padding: 0; }
      .children li { padding: 2px 0; }
      .children .done a { text-decoration: line-through; color: #5e6c84; }
      .meta { color: #5e6c84; font-size: 12px; margin-left: 4px; }
      h4 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; color: #5e6c84; }
      .remove { margin-left: 8px; color: #5e6c84; }
      .actions { display: flex; gap: 8px; }
      button { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/section.ts"></script>
  </body>
</html>
